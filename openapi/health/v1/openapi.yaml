openapi: 3.0.3
info:
  title: Nibble Health API
  version: 1.0.0
  description: Liveness and database readiness for api-engine.
servers:
  - url: http://localhost:8080
    description: local api-engine
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
